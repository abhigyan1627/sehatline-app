<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="application-name" content="SehatLine Patient" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f5fbfa" />
    <meta name="description" content="SehatLine — discover verified doctors and book trusted healthcare." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SehatLine" />
    <title>SehatLine — Smarter Care. Better Life.</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon.png" />
    <link rel="stylesheet" href="/assets/motion/sehatline-motion.css?v=3" />
    <link rel="stylesheet" href="/assets/pwa/install-prompt.css?v=1" />
    <link rel="stylesheet" href="./styles.css?v=23" />
    <link rel="stylesheet" href="/assets/care/care-background.css?v=1" />
    <link rel="stylesheet" href="/assets/footer/site-footer.css?v=11" />
  </head>
  <body data-pwa-id="patient" data-pwa-name="SehatLine Patient" data-pwa-icon="/patient/icons/icon.png">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div id="splash" class="splash" aria-label="Loading SehatLine">
      <div class="splash-logo-motion" aria-hidden="true">
        <img src="/assets/logos/sehatline-care-lockup-animated.svg?v=2" alt="">
      </div>
      <p>Patient care, beautifully connected</p>
    </div>

    <div id="offlineBanner" class="status-banner" role="status" hidden>
      You’re offline. Showing saved healthcare data.
    </div>

    <div class="app-shell">
      <header id="appHeader" class="app-header"></header>
      <main id="app" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-route="home" aria-label="Home">
          <span data-icon="home"></span><small>Home</small>
        </button>
        <button class="nav-item" data-route="appointments" aria-label="Appointments">
          <span data-icon="calendar"></span><small>Appointments</small>
        </button>
        <button class="nav-item ai-nav" data-route="ai" aria-label="Ask Sehat AI">
          <span class="ai-nav-orb"><span data-icon="sparkles"></span></span><small>Sehat AI</small>
        </button>
        <button class="nav-item" data-route="reports" aria-label="Reports">
          <span data-icon="file"></span><small>Reports</small>
        </button>
        <button class="nav-item" data-route="profile" aria-label="Profile">
          <span data-icon="user"></span><small>Profile</small>
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>

    <template id="modalTemplate">
      <div class="modal-backdrop" data-close-modal>
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <div class="modal-handle" aria-hidden="true"></div>
          <button class="icon-button modal-close" data-close-modal aria-label="Close dialog">
            <span data-icon="x"></span>
          </button>
          <div class="modal-content"></div>
        </section>
      </div>
    </template>

    <script src="./config.js?v=3"></script>
    <script src="/assets/care/care-tools.js?v=2" defer></script>
    <script src="/assets/footer/site-footer.js?v=11" defer></script>
    <script src="/assets/motion/sehatline-motion.js?v=3" defer></script>
    <script src="/assets/pwa/install-prompt.js?v=5" defer></script>
    <script src="./app.js?v=24" defer></script>
  </body>
</html>
