<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Animated SehatLine healthcare mark</title>
  <desc id="desc">A clear medical cross, heartbeat, care arc and leaf rapidly assemble.</desc>
  <defs>
    <linearGradient id="brand" x1="42" y1="44" x2="218" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4d9fff"/><stop offset=".5" stop-color="#38d1e6"/><stop offset="1" stop-color="#5af0aa"/>
    </linearGradient>
    <linearGradient id="leaf" x1="174" y1="112" x2="226" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6bf3b6"/><stop offset="1" stop-color="#20c983"/>
    </linearGradient>
  </defs>
  <style>
    .arc,.beat{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:draw .27s cubic-bezier(.2,.8,.3,1) forwards}
    .arc{stroke:url(#brand);stroke-width:10}.cross{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.55);animation:pop .2s cubic-bezier(.2,1.3,.3,1) .2s forwards}
    .beat{stroke:#fff;stroke-width:9;animation-delay:.36s}.leaf{opacity:0;transform-box:fill-box;transform-origin:bottom left;transform:scale(.2) rotate(-10deg);animation:leaf-in .18s cubic-bezier(.2,1.25,.3,1) forwards}.one{animation-delay:.5s}.two{animation-delay:.6s}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes leaf-in{to{opacity:1;transform:scale(1) rotate(0)}}
    @media(prefers-reduced-motion:reduce){.arc,.beat,.cross,.leaf{animation:none;opacity:1;stroke-dashoffset:0;transform:none}}
  </style>
  <path class="arc" d="M62 175C30 111 60 49 119 35c55-13 107 21 112 75"/>
  <path class="arc" style="animation-delay:.08s" d="M65 178c25 39 77 52 118 29"/>
  <g class="cross">
    <rect x="100" y="61" width="66" height="137" rx="19" fill="url(#brand)"/>
    <rect x="63" y="98" width="141" height="66" rx="19" fill="url(#brand)"/>
  </g>
  <path class="beat" d="M57 133h39l11-17 15 42 15-55 17 31h49"/>
  <path class="leaf one" d="M177 147c7-31 25-50 50-58 0 29-12 50-43 63 12-14 21-29 28-45-11 17-23 31-35 40Z" fill="url(#leaf)"/>
  <path class="leaf two" d="M170 190c15-20 34-29 57-24-10 21-27 31-51 26 12-6 23-11 35-13-14 0-27 4-41 11Z" fill="url(#leaf)"/>
</svg>
