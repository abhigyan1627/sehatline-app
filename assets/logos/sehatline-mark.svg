  <path d="M38 64h13l5.8-15 10.3 31L74 63h16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="64" r="3.5" fill="#fff"/>
  <circle cx="90" cy="63" r="3.5" fill="#fff"/>
