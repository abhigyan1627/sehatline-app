<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SehatLine oxygen tree preview</title>
    <link rel="stylesheet" href="./brand-motion.css">
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        font-family: Inter, Manrope, system-ui, sans-serif;
      }
      main {
        display: grid;
        min-height: 100vh;
        align-items: center;
        padding: clamp(24px, 6vw, 96px);
      }
      .copy { position: relative; z-index: 1; width: min(590px, 100%); }
      .eyebrow {
        margin: 0 0 16px;
        color: #078d77;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        color: #0b1f33;
        font-size: clamp(42px, 7vw, 82px);
        line-height: .98;
        letter-spacing: -.055em;
      }
      p {
        max-width: 48ch;
        margin: 24px 0 32px;
        color: #526477;
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.65;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 15px 24px;
        color: white;
        background: linear-gradient(100deg, #00a977, #00bdeb 58%, #2563eb);
        box-shadow: 0 14px 34px rgb(0 137 115 / .2);
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body class="sl-brand-surface">
    <div class="sl-oxygen-bg" aria-hidden="true"></div>
    <main>
      <section class="copy">
        <p class="eyebrow">SehatLine care network</p>
        <h1>Every breath.<br>Better care.</h1>
        <p>The oxygen tree grows from one shared care system—connecting patients and doctors with calm, trusted healthcare.</p>
        <button type="button">Get started</button>
      </section>
    </main>
  </body>
</html>
